<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dish Duty - Who's Washing Today?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: bounceIn 0.8s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: white;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.1em;
        }

        /* User Bar */
        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        .user-info {
            color: white;
            font-weight: 500;
        }

        .user-bar .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .user-bar .btn-small:hover {
            background: rgba(255,255,255,0.3);
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .today-hero {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-align: center;
            padding: 40px;
        }

        .today-hero h2 {
            color: white;
            justify-content: center;
            font-size: 1.5em;
        }

        .today-person {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .today-date {
            opacity: 0.9;
            font-size: 1.1em;
        }

        /* Auth Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f0f0;
        }

        .auth-tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            transition: all 0.2s;
        }

        .auth-tabs button.active {
            background: #667eea;
            color: white;
        }

        .auth-error {
            background: #ffe0e0;
            color: #c00;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9em;
            display: none;
        }

        .auth-error.show {
            display: block;
        }

        /* People Management */
        .people-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .person-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: popIn 0.3s ease;
            font-weight: 500;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .person-tag button {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .person-tag button:hover {
            background: rgba(255,255,255,0.5);
        }

        .add-person-form {
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="date"] {
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="date"]:focus {
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-full {
            width: 100%;
        }

        /* Calendar */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .calendar-nav button {
            background: #f0f0f0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            transition: background 0.2s;
        }

        .calendar-nav button:hover {
            background: #e0e0e0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            color: #666;
            padding: 10px;
            font-size: 0.9em;
        }

        .calendar-day {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 10px;
            min-height: 80px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .calendar-day:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .calendar-day.today {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .calendar-day.today .day-person {
            color: white;
        }

        .calendar-day.past {
            opacity: 0.6;
        }

        .calendar-day.other-month {
            opacity: 0.3;
        }

        .day-number {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .day-person {
            font-size: 0.85em;
            color: #667eea;
            font-weight: 500;
        }

        /* Week View */
        .week-view {
            display: none;
        }

        .week-view.active {
            display: block;
        }

        .calendar-view {
            display: block;
        }

        .calendar-view.hidden {
            display: none;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
        }

        .view-toggle button {
            padding: 8px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-toggle button.active {
            background: #667eea;
            color: white;
        }

        .week-day {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .week-day:hover {
            transform: translateX(5px);
        }

        .week-day.today {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .week-day.today .week-person {
            color: white;
        }

        .week-date {
            width: 120px;
            font-weight: bold;
        }

        .week-person {
            flex: 1;
            color: #667eea;
            font-weight: 500;
            font-size: 1.1em;
        }

        .week-emoji {
            font-size: 1.5em;
        }

        /* Start Date Section */
        .start-date-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .start-date-section label {
            font-weight: 500;
            color: #555;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .empty-state .emoji {
            font-size: 4em;
            margin-bottom: 15px;
        }

        /* Loading spinner */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Sync indicator */
        .sync-status {
            font-size: 0.8em;
            color: rgba(255,255,255,0.7);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .calendar-grid {
                gap: 4px;
            }

            .calendar-day {
                min-height: 60px;
                padding: 5px;
            }

            .day-number {
                font-size: 0.9em;
            }

            .day-person {
                font-size: 0.7em;
            }

            .today-person {
                font-size: 2em;
            }

            .user-bar {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        /* Fun hover effects */
        .wobble:hover {
            animation: wobble 0.5s ease;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h2 id="authTitle">Welcome to Dish Duty!</h2>

            <div class="auth-tabs">
                <button class="active" onclick="switchAuthTab('login')">Login</button>
                <button onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <div class="auth-error" id="authError"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-full" id="loginBtn">Login</button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="signupName" required minlength="2" maxlength="50" autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password (min 6 characters)</label>
                    <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-full" id="signupBtn">Create Account</button>
            </form>
        </div>
    </div>

    <div class="container">
        <!-- User Bar -->
        <div class="user-bar" id="userBar">
            <span class="user-info" id="userGreeting">Hello!</span>
            <span class="sync-status" id="syncStatus"></span>
            <button class="btn btn-small" onclick="logout()">Logout</button>
        </div>

        <header>
            <h1>Dish Duty</h1>
            <p class="subtitle">Never forget whose turn it is!</p>
        </header>

        <!-- Today's Hero -->
        <div class="card today-hero" id="todayCard">
            <h2>Today's Dish Hero</h2>
            <div class="today-person" id="todayPerson">-</div>
            <div class="today-date" id="todayDate"></div>
        </div>

        <!-- People Management -->
        <div class="card">
            <h2>The Dish Squad</h2>
            <div class="people-section" id="peopleList"></div>
            <div class="add-person-form">
                <input type="text" id="personName" placeholder="Enter name..." maxlength="50">
                <button class="btn" onclick="addPerson()">Add Person</button>
            </div>
        </div>

        <!-- Schedule Settings -->
        <div class="card">
            <h2>Schedule Settings</h2>
            <div class="start-date-section">
                <label>Rotation started on:</label>
                <input type="date" id="startDate" onchange="updateStartDate()">
                <button class="btn btn-secondary" onclick="setToToday()">Start Today</button>
            </div>
            <p style="margin-top: 15px; color: #888; font-size: 0.9em;">
                Set the date when your first person started washing dishes. The rotation will continue from there!
            </p>
        </div>

        <!-- Calendar View -->
        <div class="card">
            <div class="calendar-header">
                <h2>Dish Calendar</h2>
                <div class="view-toggle">
                    <button class="active" onclick="setView('calendar')">Month</button>
                    <button onclick="setView('week')">Week</button>
                </div>
            </div>

            <div class="calendar-nav">
                <button onclick="previousPeriod()">&larr;</button>
                <span id="currentPeriod" style="font-weight: bold; font-size: 1.2em;"></span>
                <button onclick="nextPeriod()">&rarr;</button>
                <button class="btn" style="margin-left: auto;" onclick="goToToday()">Today</button>
            </div>

            <div class="calendar-view" id="calendarView">
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="week-view" id="weekView"></div>
        </div>
    </div>

    <script>
        // ============ State ============
        let state = {
            user: null,
            token: null,
            people: [],
            startDate: new Date().toISOString().split('T')[0],
            currentView: 'calendar',
            viewDate: new Date()
        };

        const dishEmojis = ['&#127859;', '&#129368;', '&#127858;', '&#129367;', '&#127836;', '&#127837;', '&#129369;', '&#127790;', '&#127829;', '&#127828;'];
        const API_BASE = '/api';

        // ============ Utility Functions ============
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const errorEl = document.getElementById('authError');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            document.getElementById('authError').classList.remove('show');
        }

        function setSyncStatus(status) {
            document.getElementById('syncStatus').textContent = status;
        }

        // ============ Auth Functions ============
        function switchAuthTab(tab) {
            const tabs = document.querySelectorAll('.auth-tabs button');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            hideError();

            if (tab === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('authTitle').textContent = 'Welcome Back!';
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('authTitle').textContent = 'Create Your Account';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideError();

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>';

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Save token and user
                state.token = data.token;
                state.user = data.user;
                localStorage.setItem('dishDutyToken', data.token);
                localStorage.setItem('dishDutyUser', JSON.stringify(data.user));

                // Load user's schedule
                await loadSchedule();

                // Hide modal and show app
                document.getElementById('authModal').classList.add('hidden');
                updateUserBar();
                renderAll();

            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            hideError();

            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>';

            try {
                const response = await fetch(`${API_BASE}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('signupName').value,
                        email: document.getElementById('signupEmail').value,
                        password: document.getElementById('signupPassword').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Signup failed');
                }

                // Save token and user
                state.token = data.token;
                state.user = data.user;
                localStorage.setItem('dishDutyToken', data.token);
                localStorage.setItem('dishDutyUser', JSON.stringify(data.user));

                // Hide modal and show app
                document.getElementById('authModal').classList.add('hidden');
                updateUserBar();
                renderAll();

                // Welcome confetti!
                createConfetti();

            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }

        async function checkExistingSession() {
            const token = localStorage.getItem('dishDutyToken');
            const user = localStorage.getItem('dishDutyUser');

            if (!token || !user) {
                document.getElementById('authModal').classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    state.token = token;
                    state.user = JSON.parse(user);
                    await loadSchedule();
                    document.getElementById('authModal').classList.add('hidden');
                    updateUserBar();
                    renderAll();
                } else {
                    // Token invalid, show login
                    localStorage.removeItem('dishDutyToken');
                    localStorage.removeItem('dishDutyUser');
                    document.getElementById('authModal').classList.remove('hidden');
                }
            } catch (error) {
                // Network error - use cached data
                state.token = token;
                state.user = JSON.parse(user);
                loadLocalSchedule();
                document.getElementById('authModal').classList.add('hidden');
                updateUserBar();
                renderAll();
                setSyncStatus('(offline)');
            }
        }

        function logout() {
            state.token = null;
            state.user = null;
            state.people = [];
            state.startDate = new Date().toISOString().split('T')[0];
            localStorage.removeItem('dishDutyToken');
            localStorage.removeItem('dishDutyUser');
            localStorage.removeItem('dishDutySchedule');
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('signupForm').reset();
        }

        function updateUserBar() {
            if (state.user) {
                document.getElementById('userGreeting').textContent = `Hello, ${escapeHtml(state.user.name)}!`;
            }
        }

        // ============ Schedule API Functions ============
        async function loadSchedule() {
            try {
                const response = await fetch(`${API_BASE}/schedule/load`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    state.people = data.schedule.people || [];
                    state.startDate = data.schedule.startDate || new Date().toISOString().split('T')[0];
                    // Cache locally
                    saveLocalSchedule();
                }
            } catch (error) {
                // Load from local cache
                loadLocalSchedule();
            }
        }

        async function saveSchedule() {
            saveLocalSchedule();
            setSyncStatus('Saving...');

            try {
                const response = await fetch(`${API_BASE}/schedule/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify({
                        people: state.people,
                        startDate: state.startDate
                    })
                });

                if (response.ok) {
                    setSyncStatus('Saved!');
                    setTimeout(() => setSyncStatus(''), 2000);
                } else {
                    setSyncStatus('Save failed');
                }
            } catch (error) {
                setSyncStatus('(offline)');
            }
        }

        function saveLocalSchedule() {
            localStorage.setItem('dishDutySchedule', JSON.stringify({
                people: state.people,
                startDate: state.startDate
            }));
        }

        function loadLocalSchedule() {
            const cached = localStorage.getItem('dishDutySchedule');
            if (cached) {
                const data = JSON.parse(cached);
                state.people = data.people || [];
                state.startDate = data.startDate || new Date().toISOString().split('T')[0];
            }
        }

        // ============ App Functions ============
        function addPerson() {
            const input = document.getElementById('personName');
            const name = input.value.trim();

            if (name && !state.people.includes(name) && state.people.length < 20) {
                state.people.push(name);
                saveSchedule();
                renderPeople();
                renderCalendar();
                updateTodayHero();
                input.value = '';
                createConfetti();
            }
            input.focus();
        }

        function removePerson(index) {
            state.people.splice(index, 1);
            saveSchedule();
            renderPeople();
            renderCalendar();
            updateTodayHero();
        }

        function getPersonForDate(date) {
            if (state.people.length === 0) return null;

            const start = new Date(state.startDate);
            const target = new Date(date);

            start.setHours(0, 0, 0, 0);
            target.setHours(0, 0, 0, 0);

            const diffTime = target - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return null;

            const personIndex = diffDays % state.people.length;
            return state.people[personIndex];
        }

        function getEmojiForPerson(name) {
            const index = state.people.indexOf(name);
            return dishEmojis[index % dishEmojis.length];
        }

        function updateStartDate() {
            state.startDate = document.getElementById('startDate').value;
            saveSchedule();
            renderCalendar();
            updateTodayHero();
        }

        function setToToday() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            state.startDate = today;
            saveSchedule();
            renderCalendar();
            updateTodayHero();
        }

        // ============ Render Functions ============
        function renderAll() {
            document.getElementById('startDate').value = state.startDate;
            renderPeople();
            renderCalendar();
            updateTodayHero();
        }

        function renderPeople() {
            const container = document.getElementById('peopleList');

            if (state.people.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="emoji">&#129335;</div><p>No one added yet! Add your housemates above.</p></div>';
                return;
            }

            container.innerHTML = state.people.map((person, index) => `
                <div class="person-tag wobble">
                    <span>${dishEmojis[index % dishEmojis.length]}</span>
                    <span>${escapeHtml(person)}</span>
                    <button onclick="removePerson(${index})">&times;</button>
                </div>
            `).join('');
        }

        function updateTodayHero() {
            const today = new Date();
            const person = getPersonForDate(today);

            document.getElementById('todayPerson').innerHTML = person
                ? `${getEmojiForPerson(person)} ${escapeHtml(person)}`
                : 'Add people to start!';

            document.getElementById('todayDate').textContent = today.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function setView(view) {
            state.currentView = view;

            document.querySelectorAll('.view-toggle button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            if (view === 'calendar') {
                document.getElementById('calendarView').classList.remove('hidden');
                document.getElementById('weekView').classList.remove('active');
            } else {
                document.getElementById('calendarView').classList.add('hidden');
                document.getElementById('weekView').classList.add('active');
            }

            renderCalendar();
        }

        function previousPeriod() {
            if (state.currentView === 'calendar') {
                state.viewDate.setMonth(state.viewDate.getMonth() - 1);
            } else {
                state.viewDate.setDate(state.viewDate.getDate() - 7);
            }
            renderCalendar();
        }

        function nextPeriod() {
            if (state.currentView === 'calendar') {
                state.viewDate.setMonth(state.viewDate.getMonth() + 1);
            } else {
                state.viewDate.setDate(state.viewDate.getDate() + 7);
            }
            renderCalendar();
        }

        function goToToday() {
            state.viewDate = new Date();
            renderCalendar();
        }

        function renderCalendar() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (state.currentView === 'calendar') {
                renderMonthView(today);
            } else {
                renderWeekView(today);
            }
        }

        function renderMonthView(today) {
            const year = state.viewDate.getFullYear();
            const month = state.viewDate.getMonth();

            document.getElementById('currentPeriod').textContent =
                state.viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startPadding = firstDay.getDay();

            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let html = days.map(d => `<div class="calendar-day-header">${d}</div>`).join('');

            const prevMonth = new Date(year, month, 0);
            for (let i = startPadding - 1; i >= 0; i--) {
                const day = prevMonth.getDate() - i;
                const date = new Date(year, month - 1, day);
                const person = getPersonForDate(date);
                html += `
                    <div class="calendar-day other-month">
                        <div class="day-number">${day}</div>
                        ${person ? `<div class="day-person">${getEmojiForPerson(person)} ${escapeHtml(person)}</div>` : ''}
                    </div>
                `;
            }

            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                date.setHours(0, 0, 0, 0);
                const person = getPersonForDate(date);
                const isToday = date.getTime() === today.getTime();
                const isPast = date < today;

                html += `
                    <div class="calendar-day ${isToday ? 'today' : ''} ${isPast ? 'past' : ''}">
                        <div class="day-number">${day}</div>
                        ${person ? `<div class="day-person">${getEmojiForPerson(person)} ${escapeHtml(person)}</div>` : ''}
                    </div>
                `;
            }

            const totalCells = startPadding + lastDay.getDate();
            const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= remainingCells; day++) {
                const date = new Date(year, month + 1, day);
                const person = getPersonForDate(date);
                html += `
                    <div class="calendar-day other-month">
                        <div class="day-number">${day}</div>
                        ${person ? `<div class="day-person">${getEmojiForPerson(person)} ${escapeHtml(person)}</div>` : ''}
                    </div>
                `;
            }

            document.getElementById('calendarGrid').innerHTML = html;
        }

        function renderWeekView(today) {
            const startOfWeek = new Date(state.viewDate);
            startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);

            document.getElementById('currentPeriod').textContent =
                `${startOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${endOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

            let html = '';
            for (let i = 0; i < 7; i++) {
                const date = new Date(startOfWeek);
                date.setDate(date.getDate() + i);
                date.setHours(0, 0, 0, 0);

                const person = getPersonForDate(date);
                const isToday = date.getTime() === today.getTime();

                html += `
                    <div class="week-day ${isToday ? 'today' : ''}">
                        <div class="week-date">
                            ${date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}
                        </div>
                        <div class="week-person">
                            ${person ? escapeHtml(person) : 'No one assigned'}
                        </div>
                        ${person ? `<div class="week-emoji">${getEmojiForPerson(person)}</div>` : ''}
                    </div>
                `;
            }

            document.getElementById('weekView').innerHTML = html;
        }

        // ============ Fun Effects ============
        function createConfetti() {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#38ef7d'];

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.cssText = `
                        position: fixed;
                        left: ${Math.random() * 100}vw;
                        top: -10px;
                        width: 10px;
                        height: 10px;
                        background: ${colors[Math.floor(Math.random() * colors.length)]};
                        border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
                        pointer-events: none;
                        z-index: 1000;
                        animation: fall ${2 + Math.random() * 2}s linear forwards;
                    `;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }

            if (!document.getElementById('confettiStyle')) {
                const style = document.createElement('style');
                style.id = 'confettiStyle';
                style.textContent = `@keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }`;
                document.head.appendChild(style);
            }
        }

        // ============ Event Listeners ============
        document.getElementById('personName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPerson();
            }
        });

        // ============ Initialize ============
        checkExistingSession();
    </script>
</body>
</html>
